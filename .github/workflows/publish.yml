name: Publish package

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - .npm-publish-trigger

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'lasder-ca/Nelo'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require the publish commit to be current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          head_sha="$(git rev-parse HEAD)"
          test "${head_sha}" = "${main_sha}" || {
            echo "npm publish must run from current main (${main_sha}), got ${head_sha}" >&2
            exit 1
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2 snapshot
        with:
          deno-version: v2.x

      - name: Validate package without publish credentials
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run check:package
          npm run check:tarball

      - name: Publish package
        shell: bash
        env:
          # Temporary fallback until npm Trusted Publishing is configured for this workflow.
          # Remove this secret after the first verified OIDC-only publish.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          publish_tag="latest"
          if [[ "${version}" == *-* ]]; then
            publish_tag="next"
          fi

          if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
            echo "${package_name}@${version} is already published"
            tagged_version="$(npm view "${package_name}@${publish_tag}" version 2>/dev/null || true)"
            if [[ "${tagged_version}" != "${version}" ]]; then
              npm dist-tag add "${package_name}@${version}" "${publish_tag}"
            fi
          else
            npm publish --access public --tag "${publish_tag}" --provenance
          fi

          npm access set status=public "${package_name}"
          encoded="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "${package_name}")"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "https://registry.npmjs.org/${encoded}" >/dev/null; then
              echo "${package_name}@${version} is publicly available"
              exit 0
            fi
            echo "waiting for public registry propagation (${attempt}/12)"
            sleep 5
          done
          echo "${package_name}@${version} is not publicly readable" >&2
          exit 1

      - name: Create GitHub release
        if: github.event_name != 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "GitHub release ${tag} already exists"
            exit 0
          fi

          args=(
            release create "${tag}"
            --target "${GITHUB_SHA}"
            --title "Nelo ${version}"
            --generate-notes
          )
          if [[ "${version}" == *-* ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi

          gh "${args[@]}"
