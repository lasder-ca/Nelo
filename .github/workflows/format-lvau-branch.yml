name: Format Lvau integration branch

on:
  push:
    branches: [feat/lvau-request-integration]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/lvau-request-integration
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/integrations/lvau.md examples/lvau-service/mod.ts
          git commit -m "style: format documentation and example"
          git push origin HEAD:feat/lvau-request-integration
